mappings:
  # Metadata record and fixed profile values ---------------------------------
  - id: MDB-001
    source: entry_tbl.uuid
    mapping: transform
    target: 'mdb:MD_Metadata/mdb:metadataIdentifier/mcc:MD_Identifier/mcc:code'
    status: ready
    rule: Prefix the dataset UUID with 'datapond-metadata-' to distinguish the metadata record identifier from the resource identifier.

  - id: MDB-002
    source: constant:dataset
    mapping: constant
    target: 'mdb:MD_Metadata/mdb:metadataScope/mdb:MD_MetadataScope/mdb:resourceScope/mcc:MD_ScopeCode'
    status: ready
    rule: Emit codeListValue='dataset'.

  - id: MDB-003
    source: constant:eng
    mapping: constant
    target: 'mdb:MD_Metadata/mdb:defaultLocale/lan:PT_Locale/lan:language/lan:LanguageCode'
    status: ready
    rule: Profile default; replace when a stored metadata-language field is introduced.

  - id: MDB-004
    source: constant:UTF-8
    mapping: constant
    target: 'mdb:MD_Metadata/mdb:defaultLocale/lan:PT_Locale/lan:characterEncoding/lan:MD_CharacterSetCode'
    status: ready
    rule: Emit codeListValue='utf8'.

  - id: MDB-005
    source: entry_tbl.metadata_creation_date
    mapping: transform
    target: 'mdb:MD_Metadata/mdb:dateInfo/cit:CI_Date/cit:date'
    status: conditional
    rule: Emit with sibling cit:dateType codeListValue='creation'. Fall back to the earliest metadata_review_tbl.review_timestamp.

  - id: MDB-006
    source: metadata_review_tbl.review_timestamp
    mapping: transform
    target: 'mdb:MD_Metadata/mdb:dateInfo/cit:CI_Date/cit:date'
    status: ready
    rule: Emit the maximum timestamp with sibling cit:dateType codeListValue='lastUpdate'.

  - id: MDB-007
    source: constant:ISO-19115-1-profile
    mapping: constant
    target: 'mdb:MD_Metadata/mdb:metadataStandard/cit:CI_Citation'
    status: ready
    rule: Emit title 'ISO 19115-1:2014 geographic metadata — DataPond profile' and edition 'DataPond crosswalk 1.1.0'.

  # Resource citation and identification ------------------------------------
  - id: CIT-001
    source: entry_tbl.title
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:citation/cit:CI_Citation/cit:title'
    status: ready

  - id: CIT-002
    source: entry_tbl.citation_date
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:citation/cit:CI_Citation/cit:date/cit:CI_Date/cit:date'
    status: ready
    rule: Emit with sibling cit:dateType codeListValue='publication'.

  - id: CIT-003
    source: entry_tbl.version
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:citation/cit:CI_Citation/cit:edition'
    status: ready

  - id: CIT-004
    source: entry_tbl.uuid
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:citation/cit:CI_Citation/cit:identifier/mcc:MD_Identifier/mcc:code'
    status: ready
    rule: Primary persistent resource identifier.

  - id: CIT-005
    source: entry_tbl.citation_key
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:citation/cit:CI_Citation/cit:identifier/mcc:MD_Identifier/mcc:code'
    status: ready
    rule: Emit as an additional identifier with codeSpace='DataPond citation key'.

  - id: CIT-006
    source: entry_tbl.citation
    mapping: extension
    target: 'DataPond:renderedCitation'
    status: extension
    rule: A rendered citation is derived presentation text; do not duplicate it into CI_Citation properties.

  - id: MRI-001
    source: entry_tbl.abstract
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:abstract'
    status: ready

  - id: MRI-002
    source: entry_tbl.purpose
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:purpose'
    status: ready

  - id: MRI-003
    source: entry_tbl.dataset_credit
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:credit'
    status: ready

  - id: MRI-004
    source: entry_tbl.data_complete_status
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:status/mcc:MD_ProgressCode'
    status: ready
    rule: Translate the DataPond status vocabulary to the closest MD_ProgressCode and retain the original value in an extension when there is no exact code.

  - id: MRI-005
    source: entry_tbl.update_frequency
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceMaintenance/mmi:MD_MaintenanceInformation/mmi:maintenanceAndUpdateFrequency/mmi:MD_MaintenanceFrequencyCode'
    status: conditional
    rule: Map controlled values to MD_MaintenanceFrequencyCode; put unmatched explanatory text in mmi:maintenanceNote.

  - id: MRI-006
    source: entry_tbl.software_desc
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:supplementalInformation'
    status: deprecated-fallback
    rule: Prefer structured process references in dataset_lineage_tbl where software affected production.

  # Keywords. Each stored value creates a separate keyword property. ---------
  - id: MRI-KW-001
    source: entry_tbl.keyword_object
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:descriptiveKeywords/mri:MD_Keywords/mri:keyword'
    status: ready
    rule: Emit a keyword group with mri:type codeListValue='theme'.

  - id: MRI-KW-002
    source: entry_tbl.keyword_discipline
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:descriptiveKeywords/mri:MD_Keywords/mri:keyword'
    status: ready
    rule: Emit a keyword group with mri:type codeListValue='discipline'.

  - id: MRI-KW-003
    source: entry_tbl.keyword_topic
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:descriptiveKeywords/mri:MD_Keywords/mri:keyword'
    status: ready
    rule: Emit a keyword group with mri:type codeListValue='theme'.

  - id: MRI-KW-004
    source: entry_tbl.keyword_geo
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:descriptiveKeywords/mri:MD_Keywords/mri:keyword'
    status: ready
    rule: Emit a keyword group with mri:type codeListValue='place'.

  # Temporal extent ----------------------------------------------------------
  - id: GEX-T-001
    source: entry_tbl.temporal_coverage_start_date
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:extent/gex:EX_Extent/gex:temporalElement/gex:EX_TemporalExtent/gex:extent/gml:TimePeriod/gml:beginPosition'
    status: ready

  - id: GEX-T-002
    source: entry_tbl.temporal_coverage_end_date
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:extent/gex:EX_Extent/gex:temporalElement/gex:EX_TemporalExtent/gex:extent/gml:TimePeriod/gml:endPosition'
    status: ready
    rule: When blank because the dataset is ongoing, emit an indeterminate end position rather than copying the start date.

  # Geographic extent. Summary coordinates are already WGS 84. -------------
  - id: GEX-G-001
    source: dataset_spatial_summary_tbl.xmin
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:extent/gex:EX_Extent/gex:geographicElement/gex:EX_GeographicBoundingBox/gex:westBoundLongitude'
    status: conditional
    condition: dataset_spatial_summary_tbl.bbox_status indicates a valid derived or manual extent.

  - id: GEX-G-002
    source: dataset_spatial_summary_tbl.xmax
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:extent/gex:EX_Extent/gex:geographicElement/gex:EX_GeographicBoundingBox/gex:eastBoundLongitude'
    status: conditional
    condition: dataset_spatial_summary_tbl.bbox_status indicates a valid derived or manual extent.

  - id: GEX-G-003
    source: dataset_spatial_summary_tbl.ymin
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:extent/gex:EX_Extent/gex:geographicElement/gex:EX_GeographicBoundingBox/gex:southBoundLatitude'
    status: conditional
    condition: dataset_spatial_summary_tbl.bbox_status indicates a valid derived or manual extent.

  - id: GEX-G-004
    source: dataset_spatial_summary_tbl.ymax
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:extent/gex:EX_Extent/gex:geographicElement/gex:EX_GeographicBoundingBox/gex:northBoundLatitude'
    status: conditional
    condition: dataset_spatial_summary_tbl.bbox_status indicates a valid derived or manual extent.

  - id: GEX-G-005
    source: entry_tbl.bbox
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:extent/gex:EX_Extent/gex:geographicElement/gex:EX_GeographicBoundingBox'
    status: deprecated-fallback
    rule: Parse and validate only when no valid dataset_spatial_summary_tbl row exists; never serialize the composite string directly.

  - id: GEX-G-006
    source: dataset_spatial_summary_tbl.derivation_method
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:processStep/mrl:LI_ProcessStep/mrl:description'
    status: conditional
    rule: Emit a lineage step describing how the published WGS84 extent was calculated.

  # Native reference systems and spatial representation ---------------------
  - id: MRS-001
    source: data_file_spatial_metadata_tbl.crs_auth_code
    mapping: transform
    target: 'mdb:referenceSystemInfo/mrs:MD_ReferenceSystem/mrs:referenceSystemIdentifier/mcc:MD_Identifier/mcc:code'
    status: conditional
    rule: Deduplicate by authority code across included primary resources.

  - id: MRS-002
    source: data_file_spatial_metadata_tbl.crs_auth_code
    mapping: transform
    target: 'mdb:referenceSystemInfo/mrs:MD_ReferenceSystem/mrs:referenceSystemIdentifier/mcc:MD_Identifier/mcc:codeSpace'
    status: conditional
    rule: Split authority and code; emit EPSG or ESRI as codeSpace.

  - id: MRS-003
    source: data_file_spatial_metadata_tbl.crs_name
    mapping: direct
    target: 'mdb:referenceSystemInfo/mrs:MD_ReferenceSystem/mrs:referenceSystemIdentifier/mcc:MD_Identifier/mcc:description'
    status: conditional

  - id: MRS-004
    source: entry_tbl.epsg_code
    mapping: transform
    target: 'mdb:referenceSystemInfo/mrs:MD_ReferenceSystem/mrs:referenceSystemIdentifier/mcc:MD_Identifier/mcc:code'
    status: deprecated-fallback
    rule: Use only when no accepted file-level CRS exists; validate the code against its authority before export.

  - id: MRS-005
    source: data_file_spatial_metadata_tbl.crs_input
    mapping: extension
    target: 'DataPond:nativeCrsDefinition'
    status: extension
    rule: Preserve WKT or PROJ text as evidence; ISO export uses the structured reference-system identifier.

  - id: MSR-001
    source: data_file_spatial_metadata_tbl.spatial_type
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:spatialRepresentationType/mcc:MD_SpatialRepresentationTypeCode'
    status: conditional
    rule: Aggregate included files and emit vector, grid, textTable, tin, stereoModel, or video where applicable.

  - id: MSR-002
    source: data_file_spatial_metadata_tbl.geometry_type
    mapping: transform
    target: 'mdb:spatialRepresentationInfo/msr:MD_VectorSpatialRepresentation/msr:geometricObjects/msr:MD_GeometricObjects/msr:geometricObjectType/msr:MD_GeometricObjectTypeCode'
    status: conditional
    rule: Translate geometry types to point, curve, surface, solid, complex, or composite.

  - id: MSR-003
    source: data_file_spatial_metadata_tbl.feature_count
    mapping: direct
    target: 'mdb:spatialRepresentationInfo/msr:MD_VectorSpatialRepresentation/msr:geometricObjects/msr:MD_GeometricObjects/msr:geometricObjectCount'
    status: conditional

  - id: MSR-004
    source: data_file_spatial_metadata_tbl.raster_nrow
    mapping: transform
    target: 'mdb:spatialRepresentationInfo/msr:MD_GridSpatialRepresentation/msr:axisDimensionProperties/msr:MD_Dimension/msr:dimensionSize'
    status: conditional
    rule: Emit a row dimension with MD_DimensionNameTypeCode='row'.

  - id: MSR-005
    source: data_file_spatial_metadata_tbl.raster_ncol
    mapping: transform
    target: 'mdb:spatialRepresentationInfo/msr:MD_GridSpatialRepresentation/msr:axisDimensionProperties/msr:MD_Dimension/msr:dimensionSize'
    status: conditional
    rule: Emit a column dimension with MD_DimensionNameTypeCode='column'.

  - id: MSR-006
    source: [data_file_spatial_metadata_tbl.raster_nrow, data_file_spatial_metadata_tbl.raster_ncol]
    mapping: transform
    target: 'mdb:spatialRepresentationInfo/msr:MD_GridSpatialRepresentation/msr:numberOfDimensions'
    status: conditional
    rule: Emit 2 for a simple row/column grid; omit when additional spatial or temporal axes cannot be determined reliably.

  - id: MSR-007
    source: [data_file_spatial_metadata_tbl.raster_res_x, data_file_spatial_metadata_tbl.raster_res_y]
    mapping: transform
    target: 'mdb:spatialRepresentationInfo/msr:MD_GridSpatialRepresentation/msr:axisDimensionProperties/msr:MD_Dimension/msr:resolution'
    status: conditional
    rule: Emit separate row and column resolutions with units obtained from the accepted CRS.

  - id: MSR-008
    source: data_file_spatial_metadata_tbl.raster_nlyr
    mapping: extension
    target: 'DataPond:rasterLayerCount'
    status: extension
    rule: Band/layer count is not automatically the number of spatial dimensions.

  - id: MRI-RES-001
    source: entry_tbl.cell_size
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:spatialResolution/mri:MD_Resolution/mri:distance'
    status: deprecated-fallback
    rule: Use only after parsing a numeric distance and unit; prefer extracted raster resolution.

  - id: MRI-RES-002
    source: [entry_tbl.min_scale, entry_tbl.max_scale, entry_tbl.creation_scale_note]
    mapping: extension
    target: 'DataPond:recommendedUseScaleRange'
    status: extension
    rule: These are recommended use/capture scales, not positional accuracy and not a single ISO equivalent-scale denominator.

  - id: MRI-RES-003
    source: entry_tbl.scale_factor
    mapping: extension
    target: 'DataPond:coordinateScaleFactor'
    status: extension
    rule: Do not export as ISO data quality or spatial resolution without a defined reference-system operation model.

  # Citation authors, contacts, custodians, owners, and metadata contacts -----
  - id: CIT-RP-001
    source: [authority_tbl.person_id, authority_tbl.author_order, authority_tbl.role, persons_tbl.name_first, persons_tbl.name_last]
    mapping: join
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:citation/cit:CI_Citation/cit:citedResponsibleParty/cit:CI_Responsibility/cit:party/cit:CI_Individual/cit:name'
    status: ready
    rule: Join authority_tbl to persons_tbl, order by author_order, and concatenate nonblank given and family names for display only.

  - id: CIT-RP-002
    source: [authority_tbl.role]
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:citation/cit:CI_Citation/cit:citedResponsibleParty/cit:CI_Responsibility/cit:role/cit:CI_RoleCode'
    status: ready
    rule: Map the DataPond role vocabulary to CI_RoleCode; citation authors default to codeListValue='author'.

  - id: CIT-RP-003
    source: [persons_tbl.role_title]
    mapping: direct
    target: 'cit:CI_Individual/cit:positionName'
    status: conditional
    rule: Apply within each CI_Individual constructed through an authority, point-of-contact, reviewer, or user relationship.

  - id: CIT-RP-004
    source: [persons_tbl.email]
    mapping: direct
    target: 'cit:CI_Individual/cit:contactInfo/cit:CI_Contact/cit:address/cit:CI_Address/cit:electronicMailAddress'
    status: conditional

  - id: CIT-RP-005
    source: [persons_tbl.phone_number]
    mapping: direct
    target: 'cit:CI_Individual/cit:contactInfo/cit:CI_Contact/cit:phone/cit:CI_Telephone/cit:number'
    status: conditional

  - id: CIT-RP-006
    source: [persons_tbl.organisation_id, organisation_tbl.organisation_name_full]
    mapping: join
    target: 'cit:CI_Responsibility/cit:party/cit:CI_Organisation/cit:name'
    status: conditional
    rule: Construct the organisation as the responsibility party and include the person through cit:CI_Organisation/cit:individual where the export profile supports it.

  - id: CIT-RP-007
    source: organisation_tbl.organisation_name_short
    mapping: extension
    target: 'DataPond:organisationShortName'
    status: extension
    rule: Preserve as a local abbreviation; use organisation_name_full for CI_Organisation/name.

  - id: CIT-RP-008
    source: organisation_tbl.organisation_code
    mapping: extension
    target: 'DataPond:organisationCode'
    status: extension

  - id: CIT-RP-009
    source: organisation_tbl.organisation_department
    mapping: transform
    target: 'cit:CI_Responsibility/cit:party/cit:CI_Organisation/cit:name'
    status: conditional
    rule: When the department is the responsible organizational unit, emit a labelled unit name and retain the parent organisation relationship locally; otherwise retain it as an extension.

  - id: CIT-RP-010
    source: organisation_tbl.organisation_address
    mapping: transform
    target: 'cit:CI_Organisation/cit:contactInfo/cit:CI_Contact/cit:address/cit:CI_Address'
    status: conditional
    rule: Preserve as deliveryPoint unless the value can be safely parsed into city, administrativeArea, postalCode, and country.

  - id: MRI-POC-001
    source: [poc_tbl.person_id, persons_tbl.name_first, persons_tbl.name_last]
    mapping: join
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:pointOfContact/cit:CI_Responsibility/cit:party/cit:CI_Individual/cit:name'
    status: conditional

  - id: MRI-POC-002
    source: [poc_tbl.organisation_id, organisation_tbl.organisation_name_full]
    mapping: join
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:pointOfContact/cit:CI_Responsibility/cit:party/cit:CI_Organisation/cit:name'
    status: ready

  - id: MRI-POC-003
    source: poc_tbl.role
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:pointOfContact/cit:CI_Responsibility/cit:role/cit:CI_RoleCode'
    status: ready

  - id: MRI-ORG-001
    source: [dataset_organisation_tbl.organisation_id, dataset_organisation_tbl.role, organisation_tbl.organisation_name_full]
    mapping: join
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:pointOfContact/cit:CI_Responsibility'
    status: conditional
    rule: Emit owners, custodians, originators, publishers, funders, and distributors as repeatable responsibilities with mapped CI_RoleCode values.

  - id: MDB-CONTACT-001
    source: [entry_tbl.created_by_user_id, user_tbl.person_id, persons_tbl.name_first, persons_tbl.name_last]
    mapping: join
    target: 'mdb:MD_Metadata/mdb:contact/cit:CI_Responsibility'
    status: conditional
    rule: Emit the record creator with CI_RoleCode='author' only when the user represents the metadata author.

  - id: MDB-CONTACT-002
    source: [metadata_review_tbl.reviewer_id, persons_tbl.name_first, persons_tbl.name_last, metadata_review_tbl.reviewer_role]
    mapping: join
    target: 'mdb:MD_Metadata/mdb:metadataMaintenance/mmi:MD_MaintenanceInformation/mmi:contact/cit:CI_Responsibility'
    status: conditional
    rule: Emit distinct reviewers as maintenance contacts with mapped CI_RoleCode values.

  - id: CIT-RP-011
    source: [entry_tbl.released_by_person_id, entry_tbl.released_at]
    mapping: join
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:citation/cit:CI_Citation/cit:citedResponsibleParty/cit:CI_Responsibility'
    status: conditional
    rule: Emit the releasing party as publisher only when release workflow policy establishes that responsibility.

  # Distribution, files, and online resources -------------------------------
  - id: MRD-001
    source: entry_tbl.data_distribution_url
    mapping: direct
    target: 'mdb:distributionInfo/mrd:MD_Distribution/mrd:transferOptions/mrd:MD_DigitalTransferOptions/mrd:onLine/cit:CI_OnlineResource/cit:linkage'
    status: ready

  - id: MRD-002
    source: entry_tbl.data_distributor
    mapping: extension
    target: 'DataPond:legacyDistributorText'
    status: deprecated-fallback
    rule: Prefer dataset_organisation_tbl and poc_tbl responsibilities with role='distributor'.

  - id: MRD-002A
    source: [entry_tbl.data_distributor_organisation_id, organisation_tbl.organisation_name_full]
    mapping: join
    target: 'mdb:distributionInfo/mrd:MD_Distribution/mrd:distributor/mrd:MD_Distributor/mrd:distributorContact/cit:CI_Responsibility'
    status: ready
    rule: Join the selected distributor organisation and emit CI_RoleCode='distributor'; this structured field overrides the legacy text snapshot.

  - id: MRD-003
    source: entry_tbl.data_distributor_other
    mapping: extension
    target: 'DataPond:legacyDistributorOther'
    status: deprecated-fallback

  - id: MRD-004
    source: [dataset_organisation_tbl.organisation_id, dataset_organisation_tbl.role, organisation_tbl.organisation_name_full]
    mapping: join
    target: 'mdb:distributionInfo/mrd:MD_Distribution/mrd:distributor/mrd:MD_Distributor/mrd:distributorContact/cit:CI_Responsibility'
    status: conditional
    condition: dataset_organisation_tbl.role is distributor or custodian.

  - id: MRD-005
    source: data_file_tbl.data_file_format
    mapping: transform
    target: 'mdb:distributionInfo/mrd:MD_Distribution/mrd:distributionFormat/mrd:MD_Format/mrd:formatSpecificationCitation/cit:CI_Citation/cit:title'
    status: conditional
    rule: Deduplicate normalized formats across active primary data files.

  - id: MRD-006
    source: data_file_tbl.data_file_extension
    mapping: extension
    target: 'DataPond:fileExtension'
    status: extension
    rule: Retain for inventory; format name is the ISO property.

  - id: MRD-007
    source: data_file_tbl.file_size_kb
    mapping: transform
    target: 'mdb:distributionInfo/mrd:MD_Distribution/mrd:transferOptions/mrd:MD_DigitalTransferOptions/mrd:transferSize'
    status: conditional
    rule: Sum active distributable primary resources and convert KiB to megabytes; state the conversion in export provenance.

  - id: MRD-008
    source: data_file_tbl.data_file_description
    mapping: extension
    target: 'DataPond:dataFileDescription'
    status: extension

  - id: MRD-009
    source: [data_file_tbl.data_file_rel_path_full, data_file_tbl.file_name, data_file_tbl.file_role]
    mapping: extension
    target: 'DataPond:dataFileInventory'
    status: extension
    rule: Do not expose local filesystem paths as public online-resource linkages.

  # Legal constraints and licence citation ----------------------------------
  - id: MCO-001
    source: dataset_license_tbl.access_level_code
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceConstraints/mco:MD_LegalConstraints/mco:accessConstraints/mco:MD_RestrictionCode'
    status: ready
    rule: Translate the controlled DataPond access level to the closest MD_RestrictionCode.

  - id: MCO-002
    source: dataset_license_tbl.use_constraints
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceConstraints/mco:MD_LegalConstraints/mco:useLimitation'
    status: ready

  - id: MCO-003
    source: dataset_license_tbl.license_name
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceConstraints/mco:MD_LegalConstraints/mco:reference/cit:CI_Citation/cit:title'
    status: ready

  - id: MCO-004
    source: dataset_license_tbl.license_identifier
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceConstraints/mco:MD_LegalConstraints/mco:reference/cit:CI_Citation/cit:identifier/mcc:MD_Identifier/mcc:code'
    status: conditional

  - id: MCO-005
    source: dataset_license_tbl.license_url
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceConstraints/mco:MD_LegalConstraints/mco:reference/cit:CI_Citation/cit:onlineResource/cit:CI_OnlineResource/cit:linkage'
    status: conditional

  - id: MCO-006
    source: [dataset_license_tbl.rights_holder_organisation_id, organisation_tbl.organisation_name_full]
    mapping: join
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceConstraints/mco:MD_LegalConstraints/mco:responsibleParty/cit:CI_Responsibility'
    status: conditional
    rule: Emit CI_RoleCode='rightsHolder'.

  - id: MCO-007
    source: dataset_license_tbl.license_holder
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceConstraints/mco:MD_LegalConstraints/mco:responsibleParty/cit:CI_Responsibility/cit:party/cit:CI_Organisation/cit:name'
    status: deprecated-fallback
    rule: Use only when no structured rights-holder organisation is linked.

  - id: MCO-008
    source: [dataset_license_tbl.redistribution_permission_code, dataset_license_tbl.permission_reference]
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceConstraints/mco:MD_LegalConstraints/mco:otherConstraints'
    status: conditional
    rule: Render a concise permission statement; retain the controlled code in the DataPond extension block.

  - id: MCO-009
    source: [dataset_license_tbl.required_attribution, dataset_license_tbl.attribution_text]
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceConstraints/mco:MD_LegalConstraints/mco:useLimitation'
    status: conditional
    rule: Emit attribution text only when required_attribution is true.

  - id: MCO-010
    source: [dataset_license_tbl.sensitive_data, dataset_license_tbl.sensitivity_reason, dataset_license_tbl.sensitivity_handling_code]
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceConstraints/mco:MD_LegalConstraints/mco:otherConstraints'
    status: conditional
    rule: Use legal otherConstraints unless the classification is explicitly a national-security classification warranting MD_SecurityConstraints.

  - id: MCO-011
    source: dataset_license_tbl.license_description
    mapping: direct
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceConstraints/mco:MD_LegalConstraints/mco:otherConstraints'
    status: conditional

  - id: MCO-012
    source: dataset_license_tbl.licence_notes
    mapping: extension
    target: 'DataPond:licenceNotes'
    status: extension
    rule: Internal notes are excluded unless explicitly approved for public metadata.

  - id: MCO-013
    source: [entry_tbl.access_constraints, entry_tbl.license_type, entry_tbl.use_limitations]
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceConstraints/mco:MD_LegalConstraints'
    status: deprecated-fallback
    rule: Use only when dataset_license_tbl has no saved record; map each value to its distinct accessConstraints, reference, or useLimitation property.

  - id: MCO-014
    source: [entry_tbl.embargo_status, entry_tbl.embargo_reason, entry_tbl.embargo_end_date]
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:resourceConstraints/mco:MD_LegalConstraints/mco:otherConstraints'
    status: deprecated-fallback
    rule: When embargoed, also emit accessConstraints='restricted'. Preserve the embargo end date in the DataPond rights-assessment extension until an MD_Releasability export policy is defined.

  - id: MCO-015
    source: [dataset_license_tbl.rights_basis_code, dataset_license_tbl.terms_review_date]
    mapping: extension
    target: 'DataPond:rightsAssessment'
    status: extension

  # Resource lineage and supporting documentation ---------------------------
  - id: MRL-001
    source: dataset_lineage_tbl.lineage_statement
    mapping: direct
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:statement'
    status: ready

  - id: MRL-002
    source: dataset_lineage_source_tbl.description
    mapping: direct
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:source/mrl:LI_Source/mrl:description'
    status: ready
    rule: Emit one LI_Source for every row in source_order; a provisional legacy-backfill row remains one source.

  - id: MRL-003
    source: dataset_lineage_source_tbl.title
    mapping: direct
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:source/mrl:LI_Source/mrl:sourceCitation/cit:CI_Citation/cit:title'
    status: ready

  - id: MRL-004
    source: dataset_lineage_process_step_tbl.description
    mapping: direct
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:processStep/mrl:LI_ProcessStep/mrl:description'
    status: ready

  - id: MRL-005
    source: dataset_lineage_process_step_tbl.tool_software_reference
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:processStep/mrl:LI_ProcessStep/mrl:reference/cit:CI_Citation/cit:title'
    status: conditional
    rule: Emit a software/tool citation when a stable product name or URI is available; otherwise append to process description.

  - id: MRL-006
    source: dataset_lineage_process_step_tbl.script_reference
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:processStep/mrl:LI_ProcessStep/mrl:reference/cit:CI_Citation/cit:onlineResource/cit:CI_OnlineResource/cit:linkage'
    status: conditional
    rule: Emit only portable relative references or public URIs; never publish absolute local paths.

  - id: MRL-007
    source: dataset_lineage_process_step_tbl.output_description
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:processStep/mrl:LI_ProcessStep/mrl:rationale'
    status: conditional
    rule: Append to the process description when it does not express a rationale.

  - id: MRL-011
    source: [dataset_lineage_source_tbl.identifier, dataset_lineage_source_tbl.identifier_code_space]
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:source/mrl:LI_Source/mrl:sourceCitation/cit:CI_Citation/cit:identifier/mcc:MD_Identifier'
    status: conditional

  - id: MRL-012
    source: [dataset_lineage_source_tbl.citation_date, dataset_lineage_source_tbl.citation_date_type_code]
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:source/mrl:LI_Source/mrl:sourceCitation/cit:CI_Citation/cit:date/cit:CI_Date'
    status: conditional

  - id: MRL-013
    source: dataset_lineage_source_tbl.source_uri
    mapping: direct
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:source/mrl:LI_Source/mrl:sourceCitation/cit:CI_Citation/cit:onlineResource/cit:CI_OnlineResource/cit:linkage'
    status: conditional

  - id: MRL-014
    source: [dataset_lineage_source_tbl.temporal_start, dataset_lineage_source_tbl.temporal_end]
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:source/mrl:LI_Source/mrl:sourceExtent/gex:EX_Extent/gex:temporalElement'
    status: conditional

  - id: MRL-015
    source: dataset_lineage_source_tbl.equivalent_scale_denominator
    mapping: direct
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:source/mrl:LI_Source/mrl:sourceSpatialResolution/mri:MD_Resolution/mri:equivalentScale/mri:MD_RepresentativeFraction/mri:denominator'
    status: conditional

  - id: MRL-016
    source: [dataset_lineage_source_tbl.spatial_resolution_value, dataset_lineage_source_tbl.spatial_resolution_unit]
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:source/mrl:LI_Source/mrl:sourceSpatialResolution/mri:MD_Resolution/mri:distance'
    status: conditional

  - id: MRL-017
    source: [dataset_lineage_source_tbl.responsible_person_id, dataset_lineage_source_tbl.responsible_organisation_id, dataset_lineage_source_tbl.role_code]
    mapping: join
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:source/mrl:LI_Source/mrl:sourceCitation/cit:CI_Citation/cit:citedResponsibleParty/cit:CI_Responsibility'
    status: conditional

  - id: MRL-018
    source: [dataset_lineage_process_step_tbl.step_datetime, dataset_lineage_process_step_tbl.rationale]
    mapping: direct
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:processStep/mrl:LI_ProcessStep'
    status: conditional

  - id: MRL-019
    source: [dataset_lineage_process_step_tbl.processor_person_id, dataset_lineage_process_step_tbl.processor_organisation_id, dataset_lineage_process_step_tbl.role_code]
    mapping: join
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:processStep/mrl:LI_ProcessStep/mrl:processor/cit:CI_Responsibility'
    status: conditional

  - id: MRL-020
    source: [dataset_lineage_step_source_tbl.process_step_id, dataset_lineage_step_source_tbl.source_id]
    mapping: join
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:processStep/mrl:LI_ProcessStep/mrl:source/mrl:LI_Source'
    status: ready

  - id: MRL-021
    source: dataset_lineage_source_tbl.supporting_document_id
    mapping: join
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:additionalDocumentation/cit:CI_Citation'
    status: conditional
    rule: A linked active supporting document is authoritative; emit one citation without copying its content into the source fields.

  - id: MRL-LEGACY-001
    source: [dataset_lineage_tbl.source_description, dataset_lineage_tbl.source_datasets_text]
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:source/mrl:LI_Source'
    status: deprecated-fallback
    rule: Use only when the idempotent migration has not created a structured source; never split the stored text.

  - id: MRL-LEGACY-002
    source: [dataset_lineage_tbl.process_description, dataset_lineage_tbl.processing_tools, dataset_lineage_tbl.processing_scripts, dataset_lineage_tbl.output_description]
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:processStep/mrl:LI_ProcessStep'
    status: deprecated-fallback
    rule: Use only when the idempotent migration has not created a structured step; never split the stored text.

  - id: MRL-008
    source: dataset_lineage_tbl.lineage_notes
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:statement'
    status: conditional
    rule: Append after lineage_statement under a labelled note; exclude notes marked internal by workflow policy.

  - id: MRL-009
    source: [supporting_document_tbl.document_name, supporting_document_tbl.document_type_label, supporting_document_tbl.notes]
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:additionalDocumentation/cit:CI_Citation'
    status: conditional
    condition: supporting_document_tbl.active=1 and supporting_document_tbl.include_in_lineage=1.
    rule: Use document_name as title, document_type_label as presentation-form context, and approved notes as other citation details.

  - id: MRI-DOC-001
    source: [supporting_document_tbl.document_name, supporting_document_tbl.document_type_label, supporting_document_tbl.notes]
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:additionalDocumentation/cit:CI_Citation'
    status: conditional
    condition: supporting_document_tbl.active=1 and supporting_document_tbl.include_in_metadata=1.

  - id: MRI-DOC-002
    source: supporting_document_tbl.document_rel_path
    mapping: transform
    target: 'cit:CI_Citation/cit:onlineResource/cit:CI_OnlineResource/cit:linkage'
    status: conditional
    rule: Export only if the relative reference remains resolvable in the metadata package; do not export document_path.

  - id: MRL-010
    source: [dataset_lineage_tbl.lineage_source_mode, dataset_lineage_tbl.lineage_status]
    mapping: extension
    target: 'DataPond:lineageWorkflow'
    status: extension

  # Metadata maintenance and review history ---------------------------------
  - id: MMI-001
    source: metadata_review_tbl.review_timestamp
    mapping: direct
    target: 'mdb:metadataMaintenance/mmi:MD_MaintenanceInformation/mmi:maintenanceDate'
    status: ready
    rule: Emit repeatable dates or only the latest date according to the selected export policy.

  - id: MMI-002
    source: [metadata_review_tbl.update_reason, metadata_review_tbl.update_summary, metadata_review_tbl.notes]
    mapping: transform
    target: 'mdb:metadataMaintenance/mmi:MD_MaintenanceInformation/mmi:maintenanceNote'
    status: ready
    rule: Render one labelled maintenance note per review event; exclude empty and internal-only fragments.

  - id: MMI-003
    source: metadata_review_tbl.metadata_section
    mapping: transform
    target: 'mdb:metadataMaintenance/mmi:MD_MaintenanceInformation/mmi:maintenanceScope/mcc:MD_Scope'
    status: conditional
    rule: Map known sections to MD_ScopeCode; retain finer-grained app section identifiers in the extension block.

  - id: MMI-004
    source: [metadata_review_tbl.update_type, metadata_review_tbl.metadata_status, metadata_review_tbl.source_of_change, metadata_review_tbl.app_version]
    mapping: extension
    target: 'DataPond:metadataReviewEvent'
    status: extension

  - id: MMI-005
    source: metadata_review_tbl.review_date
    mapping: extension
    target: 'DataPond:legacyReviewDate'
    status: deprecated-fallback
    rule: review_timestamp is authoritative.

  - id: MMI-006
    source: metadata_review_tbl.reviewer_name
    mapping: extension
    target: 'DataPond:legacyReviewerName'
    status: deprecated-fallback
    rule: reviewer_id joined to persons_tbl is authoritative.

  # Content and attribute descriptions --------------------------------------
  - id: MRC-001
    source: dataset_attribute_tbl.data_field_name
    mapping: direct
    target: 'mdb:contentInfo/mrc:MD_CoverageDescription/mrc:attributeGroup/mrc:MD_AttributeGroup/mrc:attribute/mrc:MD_SampleDimension/mrc:sequenceIdentifier'
    status: conditional
    condition: The field describes a coverage sample dimension.
    rule: Vector and tabular field catalogues should additionally be exported through an ISO 19110 feature catalogue.

  - id: MRC-002
    source: dataset_attribute_tbl.data_field_alias
    mapping: direct
    target: 'mdb:contentInfo/mrc:MD_CoverageDescription/mrc:attributeGroup/mrc:MD_AttributeGroup/mrc:attribute/mrc:MD_SampleDimension/mrc:name'
    status: conditional
    rule: Use as the human-readable attribute label; preserve the physical field name as sequenceIdentifier.

  - id: MRC-003
    source: dataset_attribute_tbl.data_field_desc
    mapping: direct
    target: 'mdb:contentInfo/mrc:MD_CoverageDescription/mrc:attributeGroup/mrc:MD_AttributeGroup/mrc:attribute/mrc:MD_SampleDimension/mrc:description'
    status: conditional

  - id: MRC-004
    source: dataset_attribute_tbl.data_field_units
    mapping: transform
    target: 'mdb:contentInfo/mrc:MD_CoverageDescription/mrc:attributeGroup/mrc:MD_AttributeGroup/mrc:attribute/mrc:MD_SampleDimension/mrc:units'
    status: conditional
    rule: Resolve the text to a unit of measure URI where possible; otherwise retain it in the extension representation.

  - id: MRC-005
    source: dataset_attribute_tbl.min_value
    mapping: transform
    target: 'mdb:contentInfo/mrc:MD_CoverageDescription/mrc:attributeGroup/mrc:MD_AttributeGroup/mrc:attribute/mrc:MD_SampleDimension/mrc:minValue'
    status: conditional
    condition: min_value parses as numeric and is representative of a coverage sample dimension.

  - id: MRC-006
    source: dataset_attribute_tbl.max_value
    mapping: transform
    target: 'mdb:contentInfo/mrc:MD_CoverageDescription/mrc:attributeGroup/mrc:MD_AttributeGroup/mrc:attribute/mrc:MD_SampleDimension/mrc:maxValue'
    status: conditional
    condition: max_value parses as numeric and is representative of a coverage sample dimension.

  - id: MRC-007
    source: [dataset_attribute_tbl.data_file_id, dataset_attribute_tbl.layer_name, dataset_attribute_tbl.attribute_order]
    mapping: transform
    target: 'ISO19110:FC_FeatureCatalogue/featureType/carrierOfCharacteristics'
    status: conditional
    rule: Group and order vector or tabular attributes in an external ISO 19110 feature catalogue linked from MD_FeatureCatalogueDescription.

  - id: MRC-008
    source: [dataset_attribute_tbl.legend_field, dataset_attribute_tbl.legend_field_notes]
    mapping: extension
    target: 'DataPond:portrayalHint'
    status: extension

  - id: MRC-009
    source: [dataset_attribute_tbl.attribute_type, dataset_attribute_tbl.example_values, dataset_attribute_tbl.value_count, dataset_attribute_tbl.missing_count, dataset_attribute_tbl.unique_count]
    mapping: extension
    target: 'DataPond:attributeProfile'
    status: extension
    rule: These profiling statistics are useful evidence but are not equivalent to ISO 19157 quality results without a defined measure and evaluation method.

  # Dataset lifecycle, import provenance, and local operational extensions ---
  - id: MRI-LIFE-001
    source: entry_tbl.lifecycle_status
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:status/mcc:MD_ProgressCode'
    status: conditional
    rule: Secondary fallback for MRI-004; map released to completed and archived to historicalArchive where supported by the profile vocabulary.

  - id: CIT-LIFE-001
    source: entry_tbl.released_at
    mapping: transform
    target: 'mdb:identificationInfo/mri:MD_DataIdentification/mri:citation/cit:CI_Citation/cit:date/cit:CI_Date/cit:date'
    status: deprecated-fallback
    rule: Use with dateType='publication' only when citation_date is empty and the workflow release is the actual publication event.

  - id: MRI-LIFE-002
    source: [entry_tbl.archived_at, entry_tbl.archived_by_person_id, entry_tbl.folder_locked, entry_tbl.is_hidden]
    mapping: extension
    target: 'DataPond:datasetLifecycle'
    status: extension

  - id: LOCAL-ENTRY-001
    source: [entry_tbl.folder_key, entry_tbl.dataset_path, entry_tbl.data_path, entry_tbl.data_pond_id]
    mapping: extension
    target: 'DataPond:localStorageIdentity'
    status: extension
    rule: Local paths and pond identifiers are excluded from public ISO output.

  - id: MRL-IMPORT-001
    source: [dataset_import_tbl.source_dataset_uuid, dataset_import_tbl.source_dataset_id, dataset_import_tbl.source_data_pond_id]
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:source/mrl:LI_Source/mrl:sourceCitation/cit:CI_Citation/cit:identifier/mcc:MD_Identifier/mcc:code'
    status: conditional
    rule: Prefer source_dataset_uuid; local numeric IDs and pond IDs remain DataPond provenance extensions.

  - id: MRL-IMPORT-002
    source: [dataset_import_tbl.archive_name, dataset_import_tbl.exported_at, dataset_import_tbl.imported_at, dataset_import_tbl.bundle_format_version]
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:processStep/mrl:LI_ProcessStep/mrl:description'
    status: conditional
    rule: Describe the import event without exposing local folders or user IDs.

  - id: MRL-MANUAL-001
    source: [dataset_manual_spatial_extent_tbl.extent_label, dataset_manual_spatial_extent_tbl.source_note, dataset_manual_spatial_extent_tbl.crs_auth_code]
    mapping: transform
    target: 'mdb:resourceLineage/mrl:LI_Lineage/mrl:processStep/mrl:LI_ProcessStep/mrl:description'
    status: conditional
    condition: The manual extent contributes to dataset_spatial_summary_tbl.
    rule: State who/what supplied the manual extent and which CRS was used before transformation to WGS84; audit user IDs remain local.

  - id: LOCAL-SPATIAL-001
    source: [data_file_spatial_metadata_tbl.spatial_status, data_file_spatial_metadata_tbl.crs_status, data_file_spatial_metadata_tbl.bbox_status, data_file_spatial_metadata_tbl.spatial_note, data_file_spatial_metadata_tbl.user_notes]
    mapping: extension
    target: 'DataPond:spatialExtractionReview'
    status: extension
    rule: Workflow status is not an ISO 19157 result. Promote it only after defining a quality measure, method, scope, and result.

  - id: LOCAL-FILE-001
    source: [data_file_tbl.file_role, data_file_tbl.is_container, data_file_tbl.container_type, data_file_tbl.group_family, data_file_tbl.group_key, data_file_tbl.primary_dataset, data_file_tbl.sidecar_count, data_file_tbl.sidecar_exts, data_file_tbl.sidecar_summary, data_file_tbl.content_hint, data_file_tbl.review_status, data_file_tbl.data_file_notes]
    mapping: extension
    target: 'DataPond:dataFileInventory'
    status: extension

  - id: LOCAL-LIC-001
    source: [dataset_license_tbl.access_level, dataset_license_tbl.license_template_notes, dataset_license_tbl.license_template_id]
    mapping: extension
    target: 'DataPond:licenceAssessment'
    status: deprecated-fallback
    rule: access_level_code and the copied licence fields are authoritative for ISO export.

  - id: LOCAL-DOC-001
    source: [supporting_document_tbl.document_path, supporting_document_tbl.document_dir, supporting_document_tbl.document_extension, supporting_document_tbl.document_type_auto_code, supporting_document_tbl.document_type_code, supporting_document_tbl.document_type_auto_text, supporting_document_tbl.document_type_user_set, supporting_document_tbl.document_type_user_text]
    mapping: extension
    target: 'DataPond:supportingDocumentInventory'
    status: extension
    rule: Classification evidence and absolute local paths remain local; approved title/type/notes are mapped through MRI-DOC-001 or MRL-009.

  - id: LOCAL-SPATIAL-002
    source: [dataset_spatial_summary_tbl.bbox_status, dataset_spatial_summary_tbl.status_message, dataset_spatial_summary_tbl.bbox_crs, dataset_spatial_summary_tbl.bbox_wgs84, dataset_spatial_summary_tbl.included_source_count, dataset_spatial_summary_tbl.eligible_source_count, dataset_spatial_summary_tbl.skipped_source_count, dataset_spatial_summary_tbl.contributor_keys]
    mapping: extension
    target: 'DataPond:spatialSummaryProvenance'
    status: extension
    rule: The four numeric WGS84 coordinates map to EX_GeographicBoundingBox; these fields document calculation and review state.

  - id: LOCAL-ATTR-001
    source: [dataset_attribute_tbl.data_file_rel_path_full, dataset_attribute_tbl.data_file_name, dataset_attribute_tbl.layer_name, dataset_attribute_tbl.data_pond_id]
    mapping: extension
    target: 'DataPond:attributeSourceLocator'
    status: extension
    rule: Use to associate attributes with packaged resources; never publish absolute storage paths.
