  note: New application records store a real UTC creation timestamp on INSERT; updates,
    migrations and imports never fill unknown creation with current time. Explicit
    metadata_creation_date is authoritative. When absent, only a review event explicitly
    tagged new_metadata_record can supply its recorded timestamp; ordinary reviews
    cannot establish creation. Preserve year/month/day/timestamp precision and supplied
    timezone. Never substitute resource publication or export time. Pinned DateTime-only
    creation failures remain visible. The separately reported DataPond creation-date
    precision policy 1.0.0 accepts XSD-valid root creation Dates, without changing
    upstream files or claiming upstream agreement.
