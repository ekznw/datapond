  disposition: implemented
  implementation: R/iso_distribution_export.R
  tests:
  - tests/testthat/test-iso-distribution-export.R
  - tests/testthat/test-iso-remaining-mappings.R
  note: Emit resources in sort_order, preserving URL, protocol, name, description
