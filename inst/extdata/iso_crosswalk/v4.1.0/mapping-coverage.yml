  note: Emit each ordered row as a TimePeriod. Preserve both extent_label and description
    in EX_Extent description and retain endpoint precision and explicit indeterminatePosition.
    Revalidate saved date/time values and reject reversed comparable year/month/day
    ranges. No timestamp or timezone is invented.
- id: MRI-TEMP-004
  disposition: local
  implementation: inst/extdata/iso_crosswalk/v4.1.0/manifest.yml
  tests: tests/testthat/test-iso-remaining-mappings.R
  note: Compatibility view only; structured temporal extents are authoritative.
