version: 4.1.0
scope: Full candidate with linked catalogue; subset assessments intentionally cover
  less.
meaning:
  implemented: Serializer exists; conditions, nil reasons and validation failures
    still apply.
  migration: Legacy source is backfilled into a canonical table and exported once;
    no parallel legacy XML.
  local: No independent public ISO property; retained locally or used as selection/relationship
    context. Shared source values can be mapped by another explicit entry.
limitation: This audit indexes mapping decisions and regression suites. It is not
  a per-value completeness proof for every record, codelist certification, or a claim
  that all datasets pass GAP-018.
