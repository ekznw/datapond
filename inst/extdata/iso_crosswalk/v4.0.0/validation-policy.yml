name: DataPond creation-date precision
version: 1.0.0
default_validation: pinned
optional_validation: datapond
implementation: inst/iso/validate_metadata.py
rule: An XSD-valid gco:Date on the root metadata creation CI_Date satisfies creation
  under the DataPond profile. All other pinned assertions remain required.
affected_sources:
- https://schemas.isotc211.org/19115/-1/mdb/1.3.0/mdb.sch
- https://schemas.isotc211.org/19115/-1/mdb/1.3.0/metadata-minimal.sch
affected_assertion: $hasAtLeastOneCreationDate
evidence: The pinned XSD Date_PropertyType admits Date or DateTime; the creation assertion
  only selects DateTime. This is a declared compatibility decision, not an official
  ISO interpretation.
reporting: Preserve original valid/status/checks/issues/adaptations. datapond_profile
  contains its own valid/status/issues plus accepted_deviations. Catalogue and link
  errors invalidate both outcomes; unavailable validation never passes.
persistence: Do not modify pinned resources, checksums, dates or XML to obtain a profile
  pass. Explicit policy selection is required by the internal writer; validation-report.json
  records both outcomes and the selected policy.
